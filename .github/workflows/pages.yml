name: Build and deploy website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/sotm/package-lock.json
      - name: Prepare website and application entry
        run: |
          mkdir -p _site
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='app/' --exclude='_site/' --exclude='sotm.html' --exclude='.DS_Store' ./ _site/
          cp sotm.html index.html
          printf '%s\n' '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=./sotm/"><a href="./sotm/">Ouvrir šotm</a>' > _site/sotm.html
          touch _site/.nojekyll
      - run: npm ci
        working-directory: app/sotm
      - run: npm test
        working-directory: app/sotm
      - run: npm run build
        working-directory: app/sotm
      - name: Assemble compiled application
        run: |
          mkdir -p _site/sotm
          cp -a app/sotm/dist/. _site/sotm/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
